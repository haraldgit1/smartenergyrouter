name: Build & Push (GHCR)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}

# Keep minimal global permissions; we also set them per-job below (belt & suspenders).
permissions:
  contents: read
  packages: write

jobs:
  torch_base:
    name: Build torch-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Use a PAT stored as repo secret GHCR_PAT to avoid GHCR 403 issues with GITHUB_TOKEN.
      - name: Login to GHCR (PAT)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      # Torch-base should have a stable tag that predictor_tirex can reference.
      - name: Build & push torch-base (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./services/_base/torch-base
          file: ./services/_base/torch-base/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/smartenergyrouter/torch-base:py311-torch2.3.1
            ghcr.io/${{ github.repository_owner }}/smartenergyrouter/torch-base:main
            ghcr.io/${{ github.repository_owner }}/smartenergyrouter/torch-base:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  services:
    name: Build services
    runs-on: ubuntu-latest
    needs: [torch_base]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        svc:
          - ingestor
          - feature_engine
          - optimizer
          - policy
          - router_agent
          - console_api
          - predictor_tirex
          - weather_collector
          - price_collector
          - bandit_agent
          - bandit_context_emitter
          - llm_svc

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Use a PAT stored as repo secret GHCR_PAT to avoid GHCR 403 issues with GITHUB_TOKEN.
      - name: Login to GHCR (PAT)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/smartenergyrouter/${{ matrix.svc }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag

      - name: Build & push services (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.svc }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

